# Runs on GitHub once the repository is pushed. No secrets, no deployment: lint, static verification, the full
# test suite (embedded Postgres, no external services) and the static build.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
